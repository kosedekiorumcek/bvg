<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Berlin Canlı Ulaşım Radarı (U-Bahn, S-Bahn & M45)</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="BVG Radar">
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Berlin_U-Bahn_Logo.svg/192px-Berlin_U-Bahn_Logo.svg.png">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #e9ecef;
            color: #1e293b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            padding: 8px 14px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            border-bottom: 2px solid #cbd5e1;
            z-index: 1000;
            gap: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .stats-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 600;
            flex-wrap: wrap;
            gap: 8px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #f1f5f9;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        .stat-val {
            font-weight: 700;
            color: #0f172a;
        }

        .stat-green { color: #16a34a; }
        .stat-red { color: #dc2626; }

        .badges-wrapper {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            max-height: 48px;
            overflow-y: auto;
        }

        .line-tag {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            user-select: none;
        }

        #map {
            flex: 1;
            width: 100%;
            background-color: #e2e8f0;
        }

        .train-carriage {
            transition: transform 0.05s linear;
        }

        .station-node {
            cursor: pointer;
            filter: drop-shadow(0 0 2px rgba(0,0,0,0.35));
        }

        .leaflet-tile-pane {
            filter: grayscale(1) brightness(1.05) contrast(0.85);
            opacity: 0.85;
        }

        /* Araç Bilgi Kartı (HUD) */
        .hud-card {
            font-size: 12px;
            line-height: 1.4;
        }
        .hud-title {
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        .delay-tag {
            display: inline-block;
            padding: 2px 5px;
            border-radius: 3px;
            font-weight: bold;
            color: white;
            font-size: 10px;
        }
        .delay-ok { background-color: #16a34a; }
        .delay-warn { background-color: #dc2626; }
    </style>
</head>

        // ========================================================
        // 3. COĞRAFİ MATEMATİK VE OFSET MOTORU
        // ========================================================
        function getDistanceMeters(c1, c2) {
            const R = 6371000;
            const dLat = (c2[0] - c1[0]) * Math.PI / 180;
            const dLng = (c2[1] - c1[1]) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(c1[0] * Math.PI / 180) * Math.cos(c2[0] * Math.PI / 180) *
                      Math.sin(dLng/2) * Math.sin(dLng/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function getBearing(c1, c2) {
            const lat1 = c1[0] * Math.PI / 180;
            const lat2 = c2[0] * Math.PI / 180;
            const dLng = (c2[1] - c1[1]) * Math.PI / 180;
            const y = Math.sin(dLng) * Math.cos(lat2);
            const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function catmullRom(p0, p1, p2, p3, t) {
            const v0 = (p2 - p0) * 0.5;
            const v1 = (p3 - p1) * 0.5;
            const t2 = t * t;
            const t3 = t * t2;
            return (2 * p1 - 2 * p2 + v0 + v1) * t3 +
                   (-3 * p1 + 3 * p2 - 2 * v0 - v1) * t2 +
                   v0 * t + p1;
        }

        function applyNormalOffset(coords, offsetMeters) {
            if (!offsetMeters || offsetMeters === 0) return coords;
            const result = [];
            for (let i = 0; i < coords.length; i++) {
                const prev = coords[Math.max(0, i - 1)];
                const next = coords[Math.min(coords.length - 1, i + 1)];
                const bearing = getBearing(prev, next);
                const normalAngle = (bearing + 90) * Math.PI / 180;

                const lat = coords[i][0];
                const dLat = (offsetMeters * Math.cos(normalAngle)) / 111111;
                const dLng = (offsetMeters * Math.sin(normalAngle)) / (111111 * Math.cos(lat * Math.PI / 180));

                result.push([lat + dLat, coords[i][1] + dLng]);
            }
            return result;
        }

        function buildTrack(stations, subdivisions = 10, offsetMeters = 0) {
            const points = stations.map(s => s.coords);
            const rawCoords = [];

            for (let i = 0; i < points.length - 1; i++) {
                const p0 = i > 0 ? points[i - 1] : points[i];
                const p1 = points[i];
                const p2 = points[i + 1];
                const p3 = i < points.length - 2 ? points[i + 2] : p2;

                for (let j = 0; j < subdivisions; j++) {
                    const t = j / subdivisions;
                    rawCoords.push([
                        catmullRom(p0[0], p1[0], p2[0], p3[0], t),
                        catmullRom(p0[1], p1[1], p2[1], p3[1], t)
                    ]);
                }
            }
            rawCoords.push(points[points.length - 1]);

            const finalCoords = applyNormalOffset(rawCoords, offsetMeters);
            const track = [{ coords: finalCoords[0], distance: 0 }];
            let total = 0;

            for (let i = 1; i < finalCoords.length; i++) {
                total += getDistanceMeters(finalCoords[i - 1], finalCoords[i]);
                track.push({ coords: finalCoords[i], distance: total });
            }

            const stationsWithDist = stations.map(st => {
                let closest = track[0];
                let minDist = Infinity;
                track.forEach(pt => {
                    const d = getDistanceMeters(pt.coords, st.coords);
                    if (d < minDist) {
                        minDist = d;
                        closest = pt;
                    }
                });
                return { ...st, trackDistance: closest.distance };
            });

            return { track, totalDistance: total, stations: stationsWithDist };
        }

        // ========================================================
        // 4. EVRENSEL GERÇEK ZAMANLI ARAÇ MODELİ (U, S, OTOBÜS)
        // ========================================================
        class NetworkVehicle {
            constructor(id, lineKey, type, trackNetwork, color, initialDistance, direction, speedKmh = 33) {
                this.id = id;
                this.lineKey = lineKey;
                this.type = type; // "U", "S", "BUS"
                this.network = trackNetwork;
                this.color = color;
                
                // Araç tipine göre fiziksel ölçek
                if (this.type === "BUS") {
                    this.carCount = 1;
                    this.carriageLength = 18.0; // Körüklü otobüs
                    this.carriageWidth = 3.2;
                    this.unitSpacing = 19.0;
                } else if (this.type === "S") {
                    this.carCount = 6;
                    this.carriageLength = 18.0; // S-Bahn vagonu
                    this.carriageWidth = 3.2;
                    this.unitSpacing = 19.2;
                } else {
                    this.carCount = 6;
                    this.carriageLength = 15.0; // U-Bahn vagonu
                    this.carriageWidth = 3.0;
                    this.unitSpacing = 16.2;
                }

                this.totalLength = this.carCount * this.unitSpacing;
                this.minDist = this.totalLength;
                this.maxDist = this.network.totalDistance;

                this.currentDistance = Math.max(this.minDist, Math.min(initialDistance, this.maxDist));
                this.direction = direction;
                this.speedMps = (speedKmh * 1000) / 3600;

                // Gecikme ve Durak Durumu
                this.delayMinutes = Math.random() < 0.22 ? Math.floor(Math.random() * 6) + 1 : 0; // %22 ihtimalle gecikme
                this.isDwelling = false;
                this.dwellTimer = 0;
                this.visitedStations = new Set();
                this.nextStation = "Belirleniyor...";

                this.markers = [];
                this.createGraphics();
            }

            createGraphics() {
                for (let i = 0; i < this.carCount; i++) {
                    const icon = L.divIcon({
                        className: 'carriage-container',
                        iconSize: [0, 0],
                        html: `<svg style="overflow: visible; pointer-events: none;">
                                   <rect class="train-carriage" rx="2" ry="2" 
                                         fill="${this.color}" 
                                         stroke="#ffffff" 
                                         stroke-width="1.2"
                                         style="filter: drop-shadow(0 1px 3px rgba(0,0,0,0.4));" />
                               </svg>`
                    });
                    const marker = L.marker(this.network.track[0].coords, { icon: icon }).addTo(map);

                    // Baş vagona tıklanınca Bilgi Kartı (HUD) aç
                    if (i === 0) {
                        marker.on('click', () => {
                            const delayHtml = this.delayMinutes === 0
                                ? `<span class="delay-tag delay-ok">Dakik (Zamanında)</span>`
                                : `<span class="delay-tag delay-warn">+${this.delayMinutes} dk Gecikme</span>`;

                            const speedReal = Math.round(this.speedMps * 3.6);

                            const content = `
                                <div class="hud-card">
                                    <div class="hud-title">
                                        <span style="background:${this.color}; color:#fff; padding:2px 6px; border-radius:3px;">${this.lineKey}</span>
                                        <span>${this.id}</span>
                                    </div>
                                    <div><b>Tür:</b> ${this.type === 'U' ? 'U-Bahn' : this.type === 'S' ? 'S-Bahn' : 'MetroBus'}</div>
                                    <div><b>Durum:</b> ${delayHtml}</div>
                                    <div><b>Anlık Hız:</b> ${this.isDwelling ? '0 km/s (Durakta)' : `${speedReal} km/s`}</div>
                                    <div><b>Sıradaki Durak:</b> ${this.nextStation}</div>
                                </div>
                            `;
                            L.popup().setLatLng(marker.getLatLng()).setContent(content).openOn(map);
                        });
                    }

                    this.markers.push(marker);
                }
            }

            getPointAtDistance(d) {
                let target = Math.max(0, Math.min(d, this.network.totalDistance));
                const track = this.network.track;
                let low = 0, high = track.length - 1;
                while (low <= high) {
                    let mid = Math.floor((low + high) / 2);
                    if (track[mid].distance < target) low = mid + 1;
                    else high = mid - 1;
                }
                const idx = Math.max(1, Math.min(low, track.length - 1));
                const p1 = track[idx - 1];
                const p2 = track[idx];
                const span = p2.distance - p1.distance;
                const factor = span === 0 ? 0 : (target - p1.distance) / span;

                return [
                    p1.coords[0] + (p2.coords[0] - p1.coords[0]) * factor,
                    p1.coords[1] + (p2.coords[1] - p1.coords[1]) * factor
                ];
            }

            updateNextStation() {
                let candidate = null;
                let minDistAhead = Infinity;

                for (let st of this.network.stations) {
                    const diff = (st.trackDistance - this.currentDistance) * this.direction;
                    if (diff > 0 && diff < minDistAhead) {
                        minDistAhead = diff;
                        candidate = st.name;
                    }
                }
                this.nextStation = candidate || "Son Durak";
            }

            checkDwell() {
                if (this.isDwelling) return;
                for (let st of this.network.stations) {
                    const diff = Math.abs(this.currentDistance - st.trackDistance);
                    if (diff < 20 && !this.visitedStations.has(st.name)) {
                        this.isDwelling = true;
                        this.dwellTimer = this.type === 'BUS' ? 12 : 20; // Otobüs 12sn, tren 20sn durur
                        this.visitedStations.add(st.name);
                        break;
                    } else if (diff > 80) {
                        this.visitedStations.delete(st.name);
                    }
                }
            }

            update(deltaSeconds) {
                this.updateNextStation();

                if (this.isDwelling) {
                    this.dwellTimer -= deltaSeconds;
                    if (this.dwellTimer <= 0) {
                        this.isDwelling = false;
                    }
                    this.render();
                    return;
                }

                this.currentDistance += this.speedMps * deltaSeconds * this.direction;
                this.checkDwell();

                if (this.currentDistance >= this.maxDist) {
                    this.currentDistance = this.maxDist;
                    this.direction = -1;
                    this.isDwelling = true;
                    this.dwellTimer = 25;
                } else if (this.currentDistance <= this.minDist) {
                    this.currentDistance = this.minDist;
                    this.direction = 1;
                    this.isDwelling = true;
                    this.dwellTimer = 25;
                }

                this.render();
            }

            render() {
                const zoom = map.getZoom();
                const centerLat = this.network.track[0].coords[0];
                const metersPerPixel = (40075016.686 * Math.abs(Math.cos(centerLat * Math.PI / 180))) / Math.pow(2, zoom + 8);
                
                const pixLength = Math.max(10, this.carriageLength / metersPerPixel);
                const pixWidth = Math.max(4.0, this.carriageWidth / metersPerPixel);

                for (let i = 0; i < this.carCount; i++) {
                    const carDist = this.currentDistance - (i * this.unitSpacing * this.direction);
                    const centerPos = this.getPointAtDistance(carDist);
                    const leadPos = this.getPointAtDistance(carDist + (1.0 * this.direction));
                    const angle = getBearing(centerPos, leadPos);

                    this.markers[i].setLatLng(centerPos);
                    const markerEl = this.markers[i].getElement();
                    if (markerEl) {
                        const rect = markerEl.querySelector('rect');
                        if (rect) {
                            rect.setAttribute('width', pixWidth);
                            rect.setAttribute('height', pixLength);
                            rect.setAttribute('x', -pixWidth / 2);
                            rect.setAttribute('y', -pixLength / 2);
                            rect.style.transform = `rotate(${angle}deg)`;
                            rect.style.transformOrigin = '0 0';
                        }
                    }
                }
            }
        }

        // ========================================================
        // 5. TÜM AĞIN KURULMASI VE ÇALIŞTIRILMASI
        // ========================================================
        const fleet = [];
        const badgesContainer = document.getElementById('badges-container');
        const renderedStations = new Set();
        const globalEpochSeconds = Date.now() / 1000;

        let totalUbahn = 0;
        let totalSbahn = 0;
        let totalBus = 0;

        let delayedLines = 0;
        let onTimeLines = 0;

        Object.keys(NETWORK_LINES).forEach(key => {
            const lineData = NETWORK_LINES[key];
            const net = buildTrack(lineData.stations, 10, lineData.offset);

            // Başlık Rozeti
            const badge = document.createElement('span');
            badge.className = 'line-tag';
            badge.style.backgroundColor = lineData.color;
            badge.innerText = key;
            badgesContainer.appendChild(badge);

            // Hat Polylines'ı (Otobüs kesikli, raylar düz çizgi)
            L.polyline(net.track.map(t => t.coords), {
                color: lineData.color,
                weight: lineData.type === 'BUS' ? 3.0 : 4.0,
                opacity: 0.8,
                dashArray: lineData.type === 'BUS' ? '6, 6' : null
            }).addTo(map);

            // Duraklar
            lineData.stations.forEach(st => {
                const coordKey = `${st.coords[0].toFixed(4)},${st.coords[1].toFixed(4)}`;
                if (!renderedStations.has(coordKey)) {
                    renderedStations.add(coordKey);
                    L.circleMarker(st.coords, {
                        radius: lineData.type === 'BUS' ? 2.8 : 4.0,
                        fillColor: "#ffffff",
                        color: "#1e293b",
                        weight: 1.8,
                        opacity: 1,
                        fillOpacity: 1,
                        className: "station-node"
                    }).bindPopup(`<b>${st.name}</b><br><small>${key} Durağı</small>`).addTo(map);
                }
            });

            // Sefer Hesabı
            const oneWayMinutes = (net.totalDistance / (lineData.speed * 1000 / 60));
            const trainsPerDir = Math.max(2, Math.round(oneWayMinutes / lineData.interval));
            const totalVehicles = trainsPerDir * 2;

            const oneWaySeconds = oneWayMinutes * 60;
            const roundTripSeconds = oneWaySeconds * 2;

            let lineHasDelay = false;

            for (let i = 0; i < totalVehicles; i++) {
                const staggerSeconds = (i / totalVehicles) * roundTripSeconds;
                const timeInCycle = (globalEpochSeconds + staggerSeconds) % roundTripSeconds;

                let isForward = true;
                let calculatedDistance = 0;

                if (timeInCycle < oneWaySeconds) {
                    isForward = true;
                    calculatedDistance = (timeInCycle / oneWaySeconds) * net.totalDistance;
                } else {
                    isForward = false;
                    const returnTime = timeInCycle - oneWaySeconds;
                    calculatedDistance = net.totalDistance - ((returnTime / oneWaySeconds) * net.totalDistance);
                }

                const v = new NetworkVehicle(
                    `${key}-${i+1}`,
                    key,
                    lineData.type,
                    net,
                    lineData.color,
                    calculatedDistance,
                    isForward ? 1 : -1,
                    lineData.speed
                );

                if (v.delayMinutes > 0) lineHasDelay = true;

                if (lineData.type === 'U') totalUbahn++;
                else if (lineData.type === 'S') totalSbahn++;
                else if (lineData.type === 'BUS') totalBus++;

                fleet.push(v);
            }

            if (lineHasDelay) delayedLines++;
            else onTimeLines++;
        });

        // Üst Bar İstatistiklerini Güncelle
        document.getElementById('cnt-ubahn').innerText = totalUbahn;
        document.getElementById('cnt-sbahn').innerText = totalSbahn;
        document.getElementById('cnt-bus').innerText = totalBus;
        document.getElementById('cnt-ontime').innerText = `${onTimeLines} Hat`;
        document.getElementById('cnt-delayed').innerText = `${delayedLines} Hat`;

        // ========================================================
        // 6. ANİMASYON DÖNGÜSÜ
        // ========================================================
        let lastTime = performance.now();

        function renderEngine(currentTime) {
            const deltaSeconds = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            if (deltaSeconds < 1.0) {
                fleet.forEach(v => v.update(deltaSeconds));
            }

            requestAnimationFrame(renderEngine);
        }

        requestAnimationFrame(renderEngine);

        map.on('zoom', () => {
            fleet.forEach(v => v.render());
        });

        // PWA Butonu
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const slot = document.getElementById('install-slot');
            slot.innerHTML = `<button id="btn-install" style="background:#0284c7; color:#fff; border:none; padding:3px 8px; border-radius:4px; font-weight:bold; font-size:11px; cursor:pointer;">📲 Yükle</button>`;
            document.getElementById('btn-install').addEventListener('click', async () => {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') slot.innerHTML = '';
                deferredPrompt = null;
            });
        });
    </script>
</body>
