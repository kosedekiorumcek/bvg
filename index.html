<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Berlin U-Bahn & MetroBus M45 Canlı Radar Ağı</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="BVG Radar">

    <!-- Leaflet Kütüphanesi -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #e9ecef;
            color: #1e293b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 8px 16px;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #cbd5e1;
            z-index: 1000;
            flex-wrap: wrap;
            gap: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 500;
        }

        .pulse-led {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #10b981;
            box-shadow: 0 0 6px #10b981;
            display: inline-block;
        }

        .badges-wrapper {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .line-tag {
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            color: #ffffff;
            box-shadow: 0 1px 2px rgba(0,0,0,0.25);
        }

        #map {
            flex: 1;
            width: 100%;
            background-color: #e2e8f0;
        }

        .train-carriage, .bus-body {
            transition: transform 0.05s linear;
        }

        .station-node {
            cursor: pointer;
            filter: drop-shadow(0 0 2px rgba(0,0,0,0.35));
        }

        .leaflet-tile-pane {
            filter: grayscale(1) brightness(1.05) contrast(0.85);
            opacity: 0.85;
        }
    </style>
</head>
<body>

            <span id="zoom-indicator" style="color: #0284c7; margin-left: 10px;">Zoom: 12.5</span>
        </div>
        <div class="badges-wrapper" id="badges-container"></div>

        // 6. Coğrafi ve İnterpolasyon Fonksiyonları
        function getDistanceMeters(c1, c2) {
            const R = 6371000;
            const dLat = (c2[0] - c1[0]) * Math.PI / 180;
            const dLng = (c2[1] - c1[1]) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(c1[0] * Math.PI / 180) * Math.cos(c2[0] * Math.PI / 180) *
                      Math.sin(dLng/2) * Math.sin(dLng/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function getBearing(c1, c2) {
            const lat1 = c1[0] * Math.PI / 180;
            const lat2 = c2[0] * Math.PI / 180;
            const dLng = (c2[1] - c1[1]) * Math.PI / 180;
            const y = Math.sin(dLng) * Math.cos(lat2);
            const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function catmullRom(p0, p1, p2, p3, t) {
            const v0 = (p2 - p0) * 0.5;
            const v1 = (p3 - p1) * 0.5;
            const t2 = t * t;
            const t3 = t * t2;
            return (2 * p1 - 2 * p2 + v0 + v1) * t3 +
                   (-3 * p1 + 3 * p2 - 2 * v0 - v1) * t2 +
                   v0 * t + p1;
        }

        function applyNormalOffset(coords, offsetMeters) {
            if (!offsetMeters || offsetMeters === 0) return coords;
            const result = [];
            for (let i = 0; i < coords.length; i++) {
                const prev = coords[Math.max(0, i - 1)];
                const next = coords[Math.min(coords.length - 1, i + 1)];
                const bearing = getBearing(prev, next);
                const normalAngle = (bearing + 90) * Math.PI / 180;

                const lat = coords[i][0];
                const dLat = (offsetMeters * Math.cos(normalAngle)) / 111111;
                const dLng = (offsetMeters * Math.sin(normalAngle)) / (111111 * Math.cos(lat * Math.PI / 180));
                result.push([lat + dLat, coords[i][1] + dLng]);
            }
            return result;
        }

        function buildMetroTrack(stations, subdivisions = 12, offsetMeters = 0) {
            const points = stations.map(s => s.coords);
            const rawCoords = [];

            for (let i = 0; i < points.length - 1; i++) {
                const p0 = i > 0 ? points[i - 1] : points[i];
                const p1 = points[i];
                const p2 = points[i + 1];
                const p3 = i < points.length - 2 ? points[i + 2] : p2;

                for (let j = 0; j < subdivisions; j++) {
                    const t = j / subdivisions;
                    rawCoords.push([
                        catmullRom(p0[0], p1[0], p2[0], p3[0], t),
                        catmullRom(p0[1], p1[1], p2[1], p3[1], t)
                    ]);
                }
            }
            rawCoords.push(points[points.length - 1]);

            const finalCoords = applyNormalOffset(rawCoords, offsetMeters);
            const track = [{ coords: finalCoords[0], distance: 0 }];
            let total = 0;
            for (let i = 1; i < finalCoords.length; i++) {
                total += getDistanceMeters(finalCoords[i - 1], finalCoords[i]);
                track.push({ coords: finalCoords[i], distance: total });
            }

            const stationsWithDist = stations.map(st => {
                let closest = track[0];
                let minDist = Infinity;
                track.forEach(pt => {
                    const d = getDistanceMeters(pt.coords, st.coords);
                    if (d < minDist) {
                        minDist = d;
                        closest = pt;
                    }
                });
                return { ...st, trackDistance: closest.distance };
            });

            return { track, totalDistance: total, stations: stationsWithDist };
        }

        // 7. Metro Tren Sınıfı
        class AdvancedLODTrain {
            constructor(id, lineKey, trackNetwork, color, initialDistance, direction) {
                this.id = id;
                this.lineKey = lineKey;
                this.network = trackNetwork;
                this.color = color;
                this.carCount = 6;
                
                this.carriageLength = 15.0;
                this.carriageWidth = 3.0;
                this.unitSpacing = 16.2;
                this.totalTrainLength = this.carCount * this.unitSpacing;

                this.minDist = this.totalTrainLength;
                this.maxDist = this.network.totalDistance;

                this.currentDistance = Math.max(this.minDist, Math.min(initialDistance, this.maxDist));
                this.direction = direction;
                this.speedMps = (33 * 1000) / 3600;

                this.isDwelling = false;
                this.dwellTimer = 0;
                this.visitedStations = new Set();

                this.markers = [];
                this.createCarriages();

                this.capsuleBorder = L.polyline([], {
                    color: '#ffffff',
                    weight: 8,
                    opacity: 0.95,
                    lineCap: 'round',
                    lineJoin: 'round'
                }).addTo(map);

                this.capsuleCore = L.polyline([], {
                    color: this.color,
                    weight: 5,
                    opacity: 1.0,
                    lineCap: 'round',
                    lineJoin: 'round'
                }).addTo(map);

                this.render();
            }

            createCarriages() {
                for (let i = 0; i < this.carCount; i++) {
                    const icon = L.divIcon({
                        className: 'carriage-container',
                        iconSize: [0, 0],
                        html: `<svg style="overflow: visible; pointer-events: none;">
                                   <rect class="train-carriage" rx="2" ry="2" 
                                         fill="${this.color}" stroke="#ffffff" stroke-width="1.4"
                                         style="filter: drop-shadow(0 1px 3px rgba(0,0,0,0.35));" />
                               </svg>`
                    });
                    const marker = L.marker(this.network.track[0].coords, { icon: icon }).addTo(map);
                    this.markers.push(marker);
                }
            }

            getPointAtDistance(d) {
                let target = Math.max(0, Math.min(d, this.network.totalDistance));
                const track = this.network.track;
                let low = 0, high = track.length - 1;
                while (low <= high) {
                    let mid = Math.floor((low + high) / 2);
                    if (track[mid].distance < target) low = mid + 1;
                    else high = mid - 1;
                }
                const idx = Math.max(1, Math.min(low, track.length - 1));
                const p1 = track[idx - 1];
                const p2 = track[idx];
                const span = p2.distance - p1.distance;
                const factor = span === 0 ? 0 : (target - p1.distance) / span;

                return [
                    p1.coords[0] + (p2.coords[0] - p1.coords[0]) * factor,
                    p1.coords[1] + (p2.coords[1] - p1.coords[1]) * factor
                ];
            }

            getTrackSegment(startDist, endDist) {
                const s = Math.min(startDist, endDist);
                const e = Math.max(startDist, endDist);
                const points = [this.getPointAtDistance(s)];
                
                for (let pt of this.network.track) {
                    if (pt.distance > s && pt.distance < e) {
                        points.push(pt.coords);
                    }
                }
                points.push(this.getPointAtDistance(e));
                return points;
            }

            checkDwell() {
                if (this.isDwelling) return;
                for (let st of this.network.stations) {
                    const diff = Math.abs(this.currentDistance - st.trackDistance);
                    if (diff < 20 && !this.visitedStations.has(st.name)) {
                        this.isDwelling = true;
                        this.dwellTimer = 20;
                        this.visitedStations.add(st.name);
                        break;
                    } else if (diff > 80) {
                        this.visitedStations.delete(st.name);
                    }
                }
            }

            update(deltaSeconds) {
                if (this.isDwelling) {
                    this.dwellTimer -= deltaSeconds;
                    if (this.dwellTimer <= 0) this.isDwelling = false;
                    this.render();
                    return;
                }

                this.currentDistance += this.speedMps * deltaSeconds * this.direction;
                this.checkDwell();

                if (this.currentDistance >= this.maxDist) {
                    this.currentDistance = this.maxDist;
                    this.direction = -1;
                    this.isDwelling = true;
                    this.dwellTimer = 30;
                } else if (this.currentDistance <= this.minDist) {
                    this.currentDistance = this.minDist;
                    this.direction = 1;
                    this.isDwelling = true;
                    this.dwellTimer = 30;
                }

                this.render();
            }

            render() {
                const zoom = map.getZoom();
                const centerLat = this.network.track[0].coords[0];
                const metersPerPixel = (40075016.686 * Math.abs(Math.cos(centerLat * Math.PI / 180))) / Math.pow(2, zoom + 8);
                
                const headDist = this.currentDistance;
                const tailDist = headDist - (this.totalTrainLength * this.direction);

                if (zoom >= 15.25) {
                    this.capsuleBorder.setStyle({ opacity: 0 });
                    this.capsuleCore.setStyle({ opacity: 0 });

                    const pixLength = Math.max(14, this.carriageLength / metersPerPixel);
                    const pixWidth = Math.max(5.5, this.carriageWidth / metersPerPixel);

                    for (let i = 0; i < this.carCount; i++) {
                        const carDist = this.currentDistance - (i * this.unitSpacing * this.direction);
                        const centerPos = this.getPointAtDistance(carDist);
                        const leadPos = this.getPointAtDistance(carDist + (1.0 * this.direction));
                        const angle = getBearing(centerPos, leadPos);

                        this.markers[i].setLatLng(centerPos);
                        const markerEl = this.markers[i].getElement();
                        if (markerEl) {
                            markerEl.style.display = 'block';
                            const rect = markerEl.querySelector('rect');
                            if (rect) {
                                rect.setAttribute('width', pixWidth);
                                rect.setAttribute('height', pixLength);
                                rect.setAttribute('x', -pixWidth / 2);
                                rect.setAttribute('y', -pixLength / 2);
                                rect.style.transform = `rotate(${angle}deg)`;
                                rect.style.transformOrigin = '0 0';
                            }
                        }
                    }
                } else {
                    for (let i = 0; i < this.carCount; i++) {
                        const markerEl = this.markers[i].getElement();
                        if (markerEl) markerEl.style.display = 'none';
                    }

                    const segmentCoords = this.getTrackSegment(tailDist, headDist);
                    const coreWidth = Math.max(3.5, Math.min(8.5, (zoom - 10) * 1.5 + 2));
                    const borderWidth = coreWidth + 2.5;

                    this.capsuleBorder.setLatLngs(segmentCoords);
                    this.capsuleBorder.setStyle({ opacity: 0.95, weight: borderWidth });

                    this.capsuleCore.setLatLngs(segmentCoords);
                    this.capsuleCore.setStyle({ opacity: 1.0, weight: coreWidth });
                }
            }
        }

        // 8. Metro Standartlarında Görünür Otobüs Sınıfı
        class RealTimeBus {

            getPointAtDistance(d) {
                let target = Math.max(0, Math.min(d, this.network.totalDistance));
                const track = this.network.track;
                let low = 0, high = track.length - 1;
                while (low <= high) {
                    let mid = Math.floor((low + high) / 2);
                    if (track[mid].distance < target) low = mid + 1;
                    else high = mid - 1;
                }
                const idx = Math.max(1, Math.min(low, track.length - 1));
                const p1 = track[idx - 1];
                const p2 = track[idx];
                const span = p2.distance - p1.distance;
                const factor = span === 0 ? 0 : (target - p1.distance) / span;

                return [
                    p1.coords[0] + (p2.coords[0] - p1.coords[0]) * factor,
                    p1.coords[1] + (p2.coords[1] - p1.coords[1]) * factor
                ];
            }

            checkDwell() {
                if (this.isDwelling) return;
                for (let st of this.network.stations) {
                    const diff = Math.abs(this.currentDistance - st.trackDistance);
                    if (diff < 15 && !this.visitedStations.has(st.name)) {
                        this.isDwelling = true;
                        this.dwellTimer = 18;
                        this.visitedStations.add(st.name);
                        break;
                    } else if (diff > 50) {
                        this.visitedStations.delete(st.name);
                    }
                }
            }

            update(deltaSeconds) {
                if (this.isDwelling) {
                    this.dwellTimer -= deltaSeconds;
                    if (this.dwellTimer <= 0) this.isDwelling = false;
                    this.render();
                    return;
                }

                this.currentDistance += this.speedMps * deltaSeconds * this.direction;
                this.checkDwell();

                if (this.currentDistance >= this.network.totalDistance) {
                    this.currentDistance = this.network.totalDistance;
                    this.direction = -1;
                    this.isDwelling = true;
                    this.dwellTimer = 35;
                } else if (this.currentDistance <= 0) {
                    this.currentDistance = 0;
                    this.direction = 1;
                    this.isDwelling = true;
                    this.dwellTimer = 35;
                }

                this.render();
            }

            render() {
                const zoom = map.getZoom();
                const centerLat = this.network.track[0].coords[0];
                const metersPerPixel = (40075016.686 * Math.abs(Math.cos(centerLat * Math.PI / 180))) / Math.pow(2, zoom + 8);

                const centerPos = this.getPointAtDistance(this.currentDistance);
                const leadPos = this.getPointAtDistance(this.currentDistance + (1.0 * this.direction));
                const angle = getBearing(centerPos, leadPos);

                if (zoom >= 14.5) {
                    this.capsuleBorder.setStyle({ opacity: 0 });
                    this.capsuleCore.setStyle({ opacity: 0 });

                    const markerEl = this.marker.getElement();
                    if (markerEl) {
                        markerEl.style.display = 'block';
                        const pixLength = Math.max(22, this.busLength / metersPerPixel);
                        const pixWidth = Math.max(8.5, this.busWidth / metersPerPixel);

                        this.marker.setLatLng(centerPos);
                        const rect = markerEl.querySelector('rect');
                        if (rect) {
                            rect.setAttribute('width', pixWidth);
                            rect.setAttribute('height', pixLength);
                            rect.setAttribute('x', -pixWidth / 2);
                            rect.setAttribute('y', -pixLength / 2);
                            rect.style.transform = `rotate(${angle}deg)`;
                            rect.style.transformOrigin = '0 0';
                        }
                    }
                } else {
                    const markerEl = this.marker.getElement();
                    if (markerEl) markerEl.style.display = 'none';

                    // Uzak çekimde okunurluğu sağlayan minimum 20 piksel garantisi
                    const minScreenPixels = 20;
                    const effectiveLengthMeters = Math.max(this.busLength, minScreenPixels * metersPerPixel);
                    const halfLen = effectiveLengthMeters / 2;

                    const pStart = this.getPointAtDistance(this.currentDistance - (halfLen * this.direction));
                    const pEnd = this.getPointAtDistance(this.currentDistance + (halfLen * this.direction));
                    const segment = [pStart, pEnd];

                    const coreWidth = Math.max(4.0, Math.min(8.5, (zoom - 10) * 1.5 + 2.0));
                    const borderWidth = coreWidth + 2.5;

                    this.capsuleBorder.setLatLngs(segment);
                    this.capsuleBorder.setStyle({ opacity: 0.95, weight: borderWidth });

                    this.capsuleCore.setLatLngs(segment);
                    this.capsuleCore.setStyle({ opacity: 1.0, weight: coreWidth });
                }
            }
        }

        // 9. Filoları Haritaya Bağlama ve Çizim
        const fleet = [];
        const badgesContainer = document.getElementById('badges-container');
        const renderedStations = new Set();
        const globalEpochSeconds = Date.now() / 1000;

        // Metro Ağını Çiz (U1-U9)
        Object.keys(U_LINES).forEach(key => {
            const lineData = U_LINES[key];
            const net = buildMetroTrack(lineData.stations, 12, lineData.offsetMeters);

            const badge = document.createElement('span');
            badge.className = 'line-tag';
            badge.style.backgroundColor = lineData.color;
            badge.innerText = key;
            badgesContainer.appendChild(badge);

            L.polyline(net.track.map(t => t.coords), {
                color: lineData.color,
                weight: 4.0,
                opacity: 0.85
            }).addTo(map);

            lineData.stations.forEach(st => {
                const coordKey = `${st.coords[0].toFixed(4)},${st.coords[1].toFixed(4)}`;
                if (!renderedStations.has(coordKey)) {
                    renderedStations.add(coordKey);
                    L.circleMarker(st.coords, {
                        radius: 4.0,
                        fillColor: "#ffffff",
                        color: "#1e293b",
                        weight: 2.0,
                        opacity: 1,
                        fillOpacity: 1,
                        className: "station-node"
                    }).bindPopup(`<b>${st.name}</b>`).addTo(map);
                }
            });

            const oneWayMinutes = (net.totalDistance / (33 * 1000 / 60));
            const trainsPerDir = Math.max(2, Math.round(oneWayMinutes / lineData.intervalMinutes));
            const totalTrains = trainsPerDir * 2;
            const oneWaySeconds = oneWayMinutes * 60;
            const roundTripSeconds = oneWaySeconds * 2;

            for (let i = 0; i < totalTrains; i++) {
                const staggerSeconds = (i / totalTrains) * roundTripSeconds;
                const timeInCycle = (globalEpochSeconds + staggerSeconds) % roundTripSeconds;

                let isForward = true;
                let calculatedDistance = 0;

                if (timeInCycle < oneWaySeconds) {
                    isForward = true;
                    calculatedDistance = (timeInCycle / oneWaySeconds) * net.totalDistance;
                } else {
                    isForward = false;
                    const returnTime = timeInCycle - oneWaySeconds;
                    calculatedDistance = net.totalDistance - ((returnTime / oneWaySeconds) * net.totalDistance);
                }

                fleet.push(new AdvancedLODTrain(
                    `${key}-${i+1}`,
                    key,
                    net,
                    lineData.color,
                    calculatedDistance,
                    isForward ? 1 : -1
                ));
            }
        });

        // M45 Yol Ağı ve Duraklar
        const m45Track = [{ coords: M45_EXACT_PATH[0], distance: 0 }];
        let m45TotalDist = 0;
        for (let i = 1; i < M45_EXACT_PATH.length; i++) {
            m45TotalDist += getDistanceMeters(M45_EXACT_PATH[i-1], M45_EXACT_PATH[i]);
            m45Track.push({ coords: M45_EXACT_PATH[i], distance: m45TotalDist });
        }

        const m45SnappedStations = M45_OFFICIAL_STOPS.map(rawSt => {
            let closestPt = m45Track[0];
            let minDist = Infinity;
            m45Track.forEach(trackPt => {
                const d = getDistanceMeters(trackPt.coords, rawSt.coords);
                if (d < minDist) {
                    minDist = d;
                    closestPt = trackPt;
                }
            });
            return {
                name: rawSt.name,
                coords: closestPt.coords,
                trackDistance: closestPt.distance
            };
        });

        m45SnappedStations.sort((a, b) => a.trackDistance - b.trackDistance);

        const m45Network = { track: m45Track, totalDistance: m45TotalDist, stations: m45SnappedStations };

        L.polyline(M45_EXACT_PATH, {
            color: "#9333ea",
            weight: 3.5,
            opacity: 0.9,
            dashArray: '6, 6'
        }).addTo(map);

        m45SnappedStations.forEach(st => {
            L.circleMarker(st.coords, {
                radius: 3.5,
                fillColor: "#ffffff",
                color: "#9333ea",
                weight: 2.0,
                opacity: 1,
                fillOpacity: 1,
                className: "station-node"
            }).bindPopup(`<b>[M45] ${st.name}</b>`).addTo(map);
        });

        const busBadge = document.createElement('span');
        busBadge.className = 'line-tag';
        busBadge.style.backgroundColor = "#9333ea";
        busBadge.innerText = 'M45';
        badgesContainer.appendChild(busBadge);

        const m45Data = { color: "#9333ea", intervalMinutes: 5 };
        const m45OneWayMinutes = (m45TotalDist / (24 * 1000 / 60));
        const m45BusesPerDir = Math.max(3, Math.round(m45OneWayMinutes / m45Data.intervalMinutes));
        const totalBuses = m45BusesPerDir * 2;
        const m45RoundTripSeconds = m45OneWayMinutes * 60 * 2;

        for (let i = 0; i < totalBuses; i++) {
            const staggerSeconds = (i / totalBuses) * m45RoundTripSeconds;
            const timeInCycle = (globalEpochSeconds + staggerSeconds) % m45RoundTripSeconds;
            const oneWaySec = m45OneWayMinutes * 60;

            let isFwd = true;
            let calcDist = 0;
            if (timeInCycle < oneWaySec) {
                isFwd = true;
                calcDist = (timeInCycle / oneWaySec) * m45TotalDist;
            } else {
                isFwd = false;
                calcDist = m45TotalDist - (((timeInCycle - oneWaySec) / oneWaySec) * m45TotalDist);
            }

            fleet.push(new RealTimeBus(`M45-${i+1}`, m45Data, m45Network, calcDist, isFwd ? 1 : -1));
        }

        document.getElementById('fleet-count').innerText = `${fleet.length} Aktif Araç Hatta`;

        // 10. Animasyon Döngüsü (60 FPS)
        let lastTime = performance.now();

        function renderEngine(currentTime) {
            const deltaSeconds = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            let dwellingCount = 0;

            if (deltaSeconds < 1.0) {
                fleet.forEach(vehicle => {
                    vehicle.update(deltaSeconds);
                    if (vehicle.isDwelling) dwellingCount++;
                });
            }

            document.getElementById('dwell-count').innerText = `${dwellingCount} Durakta`;
            requestAnimationFrame(renderEngine);
        }

        requestAnimationFrame(renderEngine);

        map.on('zoom', () => {
            const z = map.getZoom();
            document.getElementById('zoom-indicator').innerText = `Zoom: ${z.toFixed(2)}`;
            fleet.forEach(vehicle => vehicle.render());
        });

        // 11. Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log("PWA Aktif:", reg.scope))
                    .catch(err => console.log("PWA Hatası:", err));
            });
        }
    });
    </script>
</body>
</html>
